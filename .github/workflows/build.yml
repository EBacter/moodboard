name: Build Windows app

on:
  push:
    tags: ["v*"]  # pushing a tag like v1.2.0 builds the app and publishes a GitHub release
  workflow_dispatch:  # "Run workflow" button: a test build you can download from the run's page

permissions:
  contents: write  # needed to create the release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install Python packages
        run: python -m pip install -r requirements-build.txt

      - name: Install Inno Setup 6.7.3 (portable)
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup-6.7.3.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile $setup
          if ((Get-AuthenticodeSignature $setup).Status -ne "Valid") { throw "Inno Setup download is not validly signed" }
          $dir = "$env:RUNNER_TEMP\InnoSetup"
          Start-Process $setup -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER", "/PORTABLE=1", "/NOICONS", "/DIR=`"$dir`""
          if (-not (Test-Path "$dir\ISCC.exe")) { throw "Inno Setup did not install" }
          $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = (python -c "import version; print(version.__version__)").Trim() + "-dev.${{ github.run_number }}"
          }
          "version=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Build, self-test, zip and make installer
        shell: pwsh
        run: ./packaging/build.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Keep the test build (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Moodboard-${{ steps.version.outputs.version }}
          path: |
            dist/Moodboard-Setup-*.exe
            dist/Moodboard-*-windows.zip

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Moodboard ${{ steps.version.outputs.version }}
          body: |
            **Download** `Moodboard-Setup-${{ steps.version.outputs.version }}.exe` to install, or the `.zip` for a portable copy (unzip, then run `Moodboard.exe`). Windows 10/11, 64-bit.

            Windows may say *"Windows protected your PC"* because the app isn't code-signed: click **More info → Run anyway**.
          generate_release_notes: true
          files: |
            dist/Moodboard-Setup-*.exe
            dist/Moodboard-*-windows.zip
